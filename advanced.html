<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Search</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div>
            <ul class="navbar">
                <li class="navbar-google"><a href="index.html">Search</a></li>
            </ul>
            <a href="index.html">
                <img class="advance-google" src="google-pic.webp" alt="google search">
            </a>
        </div><hr>
        <div class="advance-alignment">
            <div class="headings">
                <h1>Advanced Search</h1>
                <h2 class="subheading-align">Find pages with</h2>
            </div>
            <div>
            <form action="https://www.google.com/search" method="GET">
                
                <label>All these words:</label>
                <input class="nav-text" type="text" name="as_q"><br>

                <label>This exact words or phrase:</label>
                <input class="nav-text" type="text" name="as_epq"><br>

                <label>Any of these words:</label>
                <input class="nav-text" type="text" name="as_oq"><br>

                <label>None of these words:</label>
                <input class="nav-text" type="text" name="as_eq">
                <input class="btn-advs" type="submit" value="Advanced Search">
            </form>
        </div> 
       
    </body>
</html>
